{% extends 'base.html' %}

{% block title %}새 비밀번호 설정 | 양산시민축구단 공식 온라인 스토어{% endblock %}

{% block content %}
<section class="auth-section py-5">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card auth-card shadow-lg border-0">
                    <div class="card-body p-4 p-sm-5">
                        <!-- 타이틀 및 로고 -->
                        <div class="text-center mb-4">
                            <img src="{{ url_for('static', filename='images/yangsan-fc-symbol.png') }}"
                                 alt="양산시민축구단 심볼 로고"
                                 class="auth-brand-logo mb-3"
                                 onerror="this.style.display='none';">
                            <h3 class="fw-bold text-dark mb-1">새 비밀번호 설정</h3>
                            <p class="text-muted small mt-2">안전한 로그인을 위해 새로운 비밀번호를 입력해 주세요</p>
                        </div>

                        <!-- 알림 메시지 영역 (AJAX 및 URL 파라미터 겸용) -->
                        <div id="reset-alert" class="alert d-none py-2 px-3 small rounded-3 mb-3" role="alert"></div>

                        <!-- 비밀번호 재설정 폼 -->
                        <form id="reset-password-form" novalidate>
                            <input type="hidden" name="access_token" id="hidden-access-token" value="">
                            <input type="hidden" name="refresh_token" id="hidden-refresh-token" value="">

                            <!-- 1. 새 비밀번호 -->
                            <div class="mb-3">
                                <label for="reset-password" class="form-label small fw-semibold text-secondary">
                                    새 비밀번호 <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" name="password" class="form-control border-start-0 ps-0" id="reset-password" placeholder="최소 6자 이상" required autocomplete="new-password">
                                    <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="toggle-pw1-btn">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="form-text small text-muted">최소 6자 이상 영문, 숫자 조합 권장</div>
                            </div>

                            <!-- 2. 새 비밀번호 확인 -->
                            <div class="mb-4">
                                <label for="reset-password-confirm" class="form-label small fw-semibold text-secondary">
                                    새 비밀번호 확인 <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-shield-lock"></i>
                                    </span>
                                    <input type="password" name="password_confirm" class="form-control border-start-0 ps-0" id="reset-password-confirm" placeholder="새 비밀번호 재입력" required autocomplete="new-password">
                                    <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="toggle-pw2-btn">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-auth-submit w-100 py-3 fw-bold mb-3" id="btn-reset-submit">
                                <span class="spinner-border spinner-border-sm me-2 d-none" id="reset-spinner" role="status"></span>
                                <i class="bi bi-check2-circle me-1"></i> 비밀번호 변경하기
                            </button>
                        </form>

                        <div class="text-center pt-3 border-top border-light-subtle small text-muted">
                            <a href="{{ url_for('main.login') }}" class="text-decoration-none text-secondary">
                                <i class="bi bi-arrow-left me-1"></i> 로그인으로 돌아가기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('reset-password-form');
    const alertBox = document.getElementById('reset-alert');
    const submitBtn = document.getElementById('btn-reset-submit');
    const spinner = document.getElementById('reset-spinner');
    const pwInput1 = document.getElementById('reset-password');
    const pwInput2 = document.getElementById('reset-password-confirm');
    const tokenInput = document.getElementById('hidden-access-token');
    const refInput = document.getElementById('hidden-refresh-token');

    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `alert alert-${type} py-2 px-3 small rounded-3 mb-3`;
    }

    // URL Hash (#access_token=...) 파싱 (Supabase 리디렉션 처리)
    if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        if (accessToken && tokenInput) tokenInput.value = accessToken;
        if (refreshToken && refInput) refInput.value = refreshToken;
    }

    // 비밀번호 토글
    const togglePw1 = document.getElementById('toggle-pw1-btn');
    const togglePw2 = document.getElementById('toggle-pw2-btn');

    if (togglePw1 && pwInput1) {
        togglePw1.addEventListener('click', () => {
            const isPassword = pwInput1.getAttribute('type') === 'password';
            pwInput1.setAttribute('type', isPassword ? 'text' : 'password');
            togglePw1.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    }

    if (togglePw2 && pwInput2) {
        togglePw2.addEventListener('click', () => {
            const isPassword = pwInput2.getAttribute('type') === 'password';
            pwInput2.setAttribute('type', isPassword ? 'text' : 'password');
            togglePw2.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    }

    // 폼 제출
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none';

        const password = pwInput1.value;
        const passwordConfirm = pwInput2.value;
        const accessToken = tokenInput ? tokenInput.value : '';
        const refreshToken = refInput ? refInput.value : '';

        if (!password) {
            showAlert('새 비밀번호를 입력해 주세요.', 'danger');
            pwInput1.focus();
            return;
        }

        if (password.length < 6) {
            showAlert('비밀번호는 최소 6자 이상이어야 합니다.', 'danger');
            pwInput1.focus();
            return;
        }

        if (password !== passwordConfirm) {
            showAlert('비밀번호가 일치하지 않습니다.', 'danger');
            pwInput2.focus();
            return;
        }

        submitBtn.disabled = true;
        spinner.classList.remove('d-none');

        try {
            const res = await fetch("{{ url_for('auth.reset_password') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    password: password,
                    password_confirm: passwordConfirm,
                    access_token: accessToken,
                    refresh_token: refreshToken
                })
            });
            const data = await res.json();

            if (data.success) {
                showAlert('비밀번호가 성공적으로 변경되었습니다. 새 비밀번호로 로그인해 주세요.', 'success');
                setTimeout(() => {
                    window.location.href = "{{ url_for('main.login') }}";
                }, 1500);
            } else {
                showAlert(data.message || '비밀번호 재설정에 실패했습니다. 다시 시도해 주세요.', 'danger');
            }
        } catch (err) {
            showAlert('서버와의 통신에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'danger');
        } finally {
            submitBtn.disabled = false;
            spinner.classList.add('d-none');
        }
    });
});
</script>
{% endblock %}
